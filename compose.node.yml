# Dockhand: deploy from Git with this file (build at deploy), set the variables in the stack environment.
# Compute node: Ollama + metrics agent, no dashboard. Run on each GPU machine.
#   DEMO_PROFILE=rtx4070 docker compose -f compose.node.yml up -d --build
# BIND_IP pins the published ports to one address (e.g. the machine's tailnet IP) instead of all interfaces.
# DEVICE_NAME is what the dashboard shows for this machine; the GB10 can leave it unset.
services:
  node:
    build:
      context: .
    image: ai-demo-compute:latest
    restart: unless-stopped
    environment:
      DEMO_MODE: node
      DEMO_PROFILE: ${DEMO_PROFILE:-gb10}
      DEMO_PULL: ${DEMO_PULL:-auto}
      DEVICE_NAME: ${DEVICE_NAME:-}
    ports:
      - "${BIND_IP:-0.0.0.0}:11435:11434"   # Ollama
      - "${BIND_IP:-0.0.0.0}:9101:9101"     # metrics agent
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Dedicated Ollama for the FIM/autocomplete model, never unloaded (OLLAMA_KEEP_ALIVE=-1),
  # so chat model swaps on the main instance (11435) can't evict it. Port 11436.
  # Skip it on nodes that don't serve autocomplete: docker compose up -d node
  fim:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      FIM_MODEL: ${FIM_MODEL:-qwen2.5-coder:1.5b-base}
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    ports:
      - "${BIND_IP:-0.0.0.0}:11436:11434"
    volumes:
      - ollama-fim:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$FIM_MODEL"
        ollama run "$$FIM_MODEL" "" >/dev/null
        wait
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
  ollama-fim:
