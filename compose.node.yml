# Dockhand: deploy from Git with this file (build at deploy), set the variables in the stack environment.
# Compute node: vLLM + metrics agent, no dashboard. Run on each GPU machine.
#   DEMO_PROFILE=blackwell4000 docker compose -f compose.node.yml up -d --build
# Optional dedicated containers (enable on nodes with enough VRAM):
#   docker compose -f compose.node.yml --profile embed up -d
#   docker compose -f compose.node.yml --profile fim up -d
# BIND_IP pins the published ports to one address (e.g. the machine's tailnet IP) instead of all interfaces.
# DEVICE_NAME is what the dashboard shows for this machine; the GB10 can leave it unset.
services:
  node:
    build:
      context: .
    image: ai-demo-compute:latest
    restart: unless-stopped
    shm_size: "8gb"
    environment:
      DEMO_MODE: node
      DEMO_PROFILE: ${DEMO_PROFILE:-gb10}
      DEVICE_NAME: ${DEVICE_NAME:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${BIND_IP:-0.0.0.0}:8000:8000"   # vLLM OpenAI-compatible API
      - "${BIND_IP:-0.0.0.0}:9101:9101"   # metrics agent
    volumes:
      - huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional dedicated vLLM container for embeddings (Docs Q&A / RAG). Port 8001.
  # Point the dashboard at it with VLLM_EMBED_URL=http://<host>:8001
  embed:
    profiles: ["embed"]
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      - --task
      - embed
      - --gpu-memory-utilization
      - ${EMBED_GPU_MEMORY_UTILIZATION:-0.12}
      - --max-model-len
      - "512"
    ports:
      - "${BIND_IP:-0.0.0.0}:8001:8000"
    volumes:
      - huggingface-embed:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional dedicated vLLM container for FIM/autocomplete. Port 8002.
  fim:
    profiles: ["fim"]
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${FIM_MODEL:-Qwen/Qwen2.5-Coder-1.5B}
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - ${FIM_GPU_MEMORY_UTILIZATION:-0.20}
    ports:
      - "${BIND_IP:-0.0.0.0}:8002:8000"
    volumes:
      - huggingface-fim:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  huggingface:
  huggingface-embed:
  huggingface-fim:
