services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    environment:
      OLLAMA_HOST: 0.0.0.0:11434

    ports:
      - "100.94.55.35:11434:11434"

    volumes:
      - "${HOME}/ollama-data:/root/.ollama"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
