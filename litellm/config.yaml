# ============================================================
# LiteLLM router config — AI Stack Demo (sane settings)
# Runs in Docker on the Pro 7. Fronts three hardware rungs.
# Autocomplete now routed through the router (experiment).
# ============================================================

model_list:
  # ---- Chat: Pro Max Blackwell (Ollama over Tailscale) ----
  - model_name: Blackwell_chat
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: os.environ/BLACKWELL_BASE
      num_ctx: 8192
    model_info:
      supports_function_calling: true

  # ---- Chat: GB10 (Ollama over Tailscale) ----
  - model_name: GB10_chat
    litellm_params:
      model: ollama_chat/qwen3-coder-next:q4_K_M
      api_base: os.environ/GB10_BASE
      num_ctx: 65536
    model_info:
      supports_function_calling: true

  # ---- Planning: GB10 (Cline Plan mode) ----
  - model_name: GB10_planning
    litellm_params:
      model: ollama_chat/gpt-oss:latest
      api_base: os.environ/GB10_BASE
      num_ctx: 65536
    model_info:
      supports_function_calling: true

  # ---- Autocomplete / FIM: Blackwell Ollama ----
  # ollama/ (NOT ollama_chat/) = the completion path that preserves `suffix`
  # for fill-in-the-middle. ollama_chat/ would strip FIM and break autocomplete.
  - model_name: Blackwell_autocomplete
    litellm_params:
      model: ollama/qwen2.5-coder:1.5b-base
      api_base: os.environ/BLACKWELL_BASE
      num_ctx: 8192

litellm_settings:
  drop_params: true
  num_retries: 1
  request_timeout: 900
  fallbacks:
    - GB10_chat: [Blackwell_chat]
    - GB10_planning: [GB10_chat, Blackwell_chat]
  context_window_fallbacks:
    - Blackwell_chat: [GB10_chat]

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  allowed_fails: 2
  cooldown_time: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_env_credential_login: true
