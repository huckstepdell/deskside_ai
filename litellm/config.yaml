# ============================================================
# LiteLLM router config — AI Stack Demo
# Runs in Docker on the Pro 7 and fronts three hardware tiers.
#
# Alias convention:
#   <tier>-<role>-<model>
#
# Runtime requirements:
#   - GB10 Ollama must be configured for at least 65536 context.
#   - Blackwell Ollama must be configured for at least 8192 context.
#   - Foundry remains non-streaming upstream; LiteLLM fake-streams it.
# ============================================================

model_list:
  # ---- NPU: fast local coding tier ----
  - model_name: npu-act-qwen25-coder-1p5b
    litellm_params:
      model: "openai/qwen2.5-coder-1.5b"
      api_base: "http://host.docker.internal:56194/v1"
      api_key: not-needed
      max_tokens: 2048
    model_info:
      supports_function_calling: true
      supports_native_streaming: false

  # ---- Blackwell: Act/coding tier ----
  - model_name: blackwell-act-qwen25-coder-14b
    litellm_params:
      model: "ollama_chat/qwen2.5-coder:14b"
      api_base: os.environ/BLACKWELL_BASE
      num_ctx: 8192
      max_tokens: 4096
    model_info:
      supports_function_calling: true

  # ---- GB10: Act/coding tier ----
  - model_name: gb10-act-qwen3-coder-next
    litellm_params:
      model: "ollama_chat/qwen3-coder-next:q4_K_M"
      api_base: os.environ/GB10_BASE
      num_ctx: 65536
      max_tokens: 8192
    model_info:
      supports_function_calling: true

  # ---- GB10: Plan/reasoning tier ----
  - model_name: gb10-plan-qwen38-27b
    litellm_params:
      model: "ollama_chat/qwen3.8:latest"
      api_base: os.environ/GB10_BASE
      num_ctx: 65536
      max_tokens: 12288
    model_info:
      supports_function_calling: true

  # ---- Blackwell: FIM autocomplete tier ----
  # ollama/ (not ollama_chat/) preserves the suffix required for FIM.
  - model_name: blackwell-fim-qwen25-coder-1p5b
    litellm_params:
      model: "ollama/qwen2.5-coder:1.5b-base"
      api_base: os.environ/BLACKWELL_BASE
      num_ctx: 8192
      max_tokens: 256
    model_info:
      supports_function_calling: false

litellm_settings:
  drop_params: true
  num_retries: 1
  request_timeout: 900

  # Availability fallbacks.
  fallbacks:
    - npu-act-qwen25-coder-1p5b:
        - blackwell-act-qwen25-coder-14b
        - gb10-act-qwen3-coder-next
    - gb10-act-qwen3-coder-next:
        - blackwell-act-qwen25-coder-14b
    - gb10-plan-qwen38-27b:
        - gb10-act-qwen3-coder-next

  # Context-size fallbacks. These are separate from availability fallbacks.
  context_window_fallbacks:
    - npu-act-qwen25-coder-1p5b:
        - blackwell-act-qwen25-coder-14b
        - gb10-act-qwen3-coder-next
    - blackwell-act-qwen25-coder-14b:
        - gb10-act-qwen3-coder-next

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  allowed_fails: 2
  cooldown_time: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_env_credential_login: true
