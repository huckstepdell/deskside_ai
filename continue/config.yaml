name: Dell Main Models
version: 0.0.1
schema: v1

models:
  # NPU models
  - name: NPU FIM Autocomplete
    provider: openai
    model: npu-fim-qwen25-coder-0p5b
    apiBase: http://localhost:4000/v1
    apiKey: << Your LiteLLM Virtual or Master Key >>
    useLegacyCompletionsEndpoint: true
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 200
      maxPromptTokens: 1024
      onlyMyCode: true

  - name: NPU Instruct
    provider: openai
    model: npu-act-qwen25-coder-0p5b-instruct
    apiBase: http://localhost:4000/v1
    apiKey: << Your LiteLLM Virtual or Master Key >>
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 2048

  # GB10 models
  - name: GB10 Coder
    provider: openai
    model: gb10-act-qwen3-coder-next
    apiBase: http://localhost:4000/v1
    apiKey: << Your LiteLLM Virtual or Master Key >>
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 8192

  - name: GB10 Planning
    provider: openai
    model: gb10-plan-qwen38-27b
    apiBase: http://localhost:4000/v1
    apiKey: << Your LiteLLM Virtual or Master Key >>
    roles:
      - chat
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 12288

  # Blackwell models
  - name: Blackwell Coder
    provider: openai
    model: blackwell-act-qwen25-coder-14b
    apiBase: http://localhost:4000/v1
    apiKey: << Your LiteLLM Virtual or Master Key >>
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 4096

  - name: Blackwell FIM Autocomplete
    provider: openai
    model: blackwell-fim-qwen25-coder-1p5b
    apiBase: http://localhost:4000/v1
    apiKey: << Your LiteLLM Virtual or Master Key >>
    useLegacyCompletionsEndpoint: true
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 200
      maxPromptTokens: 1024
      onlyMyCode: true
