services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    runtime: nvidia
    restart: always

    environment:
      OLLAMA_HOST: 0.0.0.0:11435
    ports:
      - "11435:11435"

    volumes:
      - "${CONTAINER_DATA_DIR:-/container_data}/ollama/ollama-data:/root/.ollama"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    command: ["serve"]

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "OLLAMA_HOST=http://127.0.0.1:11435 ollama list >/dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    restart: "no"

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11435
      PULL_MODELS: "${PULL_MODELS:?Set PULL_MODELS first}"

    volumes:
      - "${CONTAINER_DATA_DIR:-/container_data}/ollama/ollama-data:/root/.ollama"

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu
        for model in $$PULL_MODELS; do
          echo "Pulling $$model"
          ollama pull "$$model"
        done
