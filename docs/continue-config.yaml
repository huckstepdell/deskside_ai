      - apply
    defaultCompletionOptions:
      contextLength: 16384
      temperature: 0.2
      maxTokens: 4096

  - name: Fast - Blackwell 4K Nemotron 3.5 Bolt E4B
    provider: openai
    model: blackwell4000/nemotron-3.5-bolt:e4b
    apiBase: https://aperture.turtle-squeaker.ts.net/v1
    capabilities:
