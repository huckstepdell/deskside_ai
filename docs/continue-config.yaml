name: Dell Main Models
version: 0.0.2
schema: v1

# contextLength is bounded by the server's OLLAMA_CONTEXT_LENGTH (GB10 64K, Blackwell 16K, 4070 8K)
# and the model's context limit (GB10 Qwen 2.5 Coder 32B: 32K);
# maxTokens is kept well under it so the prompt still has room.
models:
  # Default chat models: Gemma 4 (vision). The first entry is Continue's default.
  - name: Chat - GB10 Gemma 4 26B
    provider: openai
    model: gb10/gemma4:26b
    apiBase: https://aperture.turtle-squeaker.ts.net/v1
    capabilities:
      - tool_use
      - image_input
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 65536
      temperature: 0.2
      maxTokens: 8192

  - name: Chat - Blackwell 4K Gemma 4 12B
    provider: openai
    model: blackwell4000/gemma4:12b
    apiBase: https://aperture.turtle-squeaker.ts.net/v1
    capabilities:
      - tool_use
      - image_input
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 16384
      temperature: 0.2
      maxTokens: 4096

  - name: Code - RTX 4070 Qwen 2.5 Coder 7B
    provider: openai
    model: rtx4070/qwen2.5-coder:7b
    apiBase: https://aperture.turtle-squeaker.ts.net/v1
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 8192
      temperature: 0.2
      maxTokens: 3072

  # GB10 models (64K server context)
