      contextLength: 16384
      temperature: 0.2
      maxTokens: 4096

  - name: Code - Blackwell 4K DeepSeek Coder V2 Lite
    provider: openai
    model: blackwell4000/deepseek-coder-v2:16b-lite-instruct
    apiBase: https://aperture.turtle-squeaker.ts.net/v1
    roles:
