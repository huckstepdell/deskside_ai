      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 16384
      temperature: 0.2
      maxTokens: 4096

  # FIM runs on a dedicated always-loaded Ollama (the `fim` service in compose.node.yml, port 11436) so chat
  # model swaps on 11435 never evict it. keepAlive -1 matches that instance's setting.
  - name: Autocomplete - Blackwell 4K Qwen 2.5 Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    apiBase: http://pro-max-plus:11436
    roles:
      - autocomplete
    defaultCompletionOptions:
      keepAlive: -1
    autocompleteOptions:
      debounceDelay: 200
      maxPromptTokens: 1024
      onlyMyCode: true

  - name: Autocomplete - RTX 4070 Qwen 2.5 Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    apiBase: http://aipc:11436
    roles:
      - autocomplete
    defaultCompletionOptions:
      keepAlive: -1
    autocompleteOptions:
      debounceDelay: 200
      maxPromptTokens: 1024
      onlyMyCode: true

