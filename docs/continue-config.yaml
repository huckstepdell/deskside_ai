  # Blackwell models (16K server context)
  - name: Code - Blackwell 4K Qwen 2.5 Coder 14B
    provider: openai
    model: blackwell4000/qwen2.5-coder:14b
    apiBase: https://aperture.turtle-squeaker.ts.net/v1
    capabilities:
      - tool_use
    roles:
      - chat
