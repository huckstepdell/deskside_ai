name: Dell Main Models
version: 0.0.2
schema: v1

# contextLength is bounded by each vLLM node's VLLM_MAX_MODEL_LEN (GB10 64K, Blackwell 40K, 4070 32K);
# maxTokens is kept well under it so the prompt still has room.
models:
  # Default chat models via Aperture. The first entry is Continue's default.
  - name: Chat - GB10 Muse Glimmer 30B (NVFP4)
    provider: openai
    model: gb10/nvidia/Muse-Glimmer-30B-NVFP4
    apiBase: https://aperture.turtle-squeaker.ts.net/v1
    capabilities:
      - tool_use
      - image_input
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 65536
      temperature: 0.2
      maxTokens: 8192

  - name: Chat - Blackwell 4K Qwen 3 8B (NVFP4 · 40K)
    provider: openai
    model: blackwell4000/nvidia/Qwen3-8B-NVFP4
    apiBase: https://aperture.turtle-squeaker.ts.net/v1
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 40960
      temperature: 0.2
      maxTokens: 4096

  - name: Chat - Blackwell 4K Qwen 3 8B (NVFP4 · 32K Demo)
    provider: openai
    model: blackwell4000/nvidia/Qwen3-8B-NVFP4-32k
    apiBase: https://aperture.turtle-squeaker.ts.net/v1
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 32768
      temperature: 0.2
      maxTokens: 4096

  - name: Code - RTX 4070 Qwen 3 8B (AWQ)
    provider: openai
    model: rtx4070/Qwen/Qwen3-8B-AWQ
    apiBase: https://aperture.turtle-squeaker.ts.net/v1
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 32768
      temperature: 0.2
      maxTokens: 4096

  # Optional FIM autocomplete via the dedicated vLLM `fim` service (compose.node.yml --profile fim, port 8002).
  - name: Autocomplete - Blackwell 4K Qwen 2.5 Coder 1.5B
    provider: openai
    model: Qwen/Qwen2.5-Coder-1.5B
    apiBase: http://pro-max-plus:8002/v1
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 200
      maxPromptTokens: 1024
      onlyMyCode: true

  - name: Autocomplete - RTX 4070 Qwen 2.5 Coder 1.5B
    provider: openai
    model: Qwen/Qwen2.5-Coder-1.5B
    apiBase: http://aipc:8002/v1
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 200
      maxPromptTokens: 1024
      onlyMyCode: true
